<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem('todo-theme')}catch(e){}
if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --bg:#e9edf5; --surface:#ffffff; --ink:#1a2138; --muted:#6b7490; --line:#e3e8f2;
  --accent:#3b5bfd; --accent-soft:#e8ecff; --danger:#e5484d; --done:#a3abc2;
  --shadow:0 1px 2px rgba(26,33,56,.06),0 12px 40px -12px rgba(26,33,56,.18);
}
:root[data-theme="dark"]{
  --bg:#10131f; --surface:#181c2c; --ink:#e8ebf6; --muted:#8c95b3; --line:#262c43;
  --accent:#7c93ff; --accent-soft:#232a4d; --danger:#ff7a7f; --done:#5d6685;
  --shadow:0 12px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  display:flex;justify-content:center;padding:clamp(16px,6vw,72px) 16px;
}
.app{width:100%;max-width:560px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em}
.date{color:var(--muted);font-size:.9rem;font-weight:500;margin-top:2px}
.actions{display:flex;align-items:center;gap:14px}
.theme{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);
  color:var(--ink);box-shadow:var(--shadow);transition:transform .2s,color .2s}
.theme:hover{transform:rotate(15deg);color:var(--accent)}
.theme svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
body,.panel,.add input,.theme{transition:background-color .25s,color .25s}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;font-weight:800}
.panel{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.add{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.add input{
  flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);
  border:2px solid transparent;border-radius:12px;padding:12px 16px;outline:none;transition:border-color .15s
}
.add input::placeholder{color:var(--muted)}
.add input:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,.check:focus-visible+.box{outline:3px solid var(--accent);outline-offset:2px}
.add button{
  background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:0 20px;transition:transform .1s,filter .15s
}
.add button:hover{filter:brightness(1.08)}
.add button:active{transform:scale(.96)}
.tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line)}
.tabs button{
  padding:6px 14px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--muted);transition:background .15s,color .15s
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
ul{list-style:none;padding:6px 8px;min-height:120px}
li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;transition:background .15s}
li:hover{background:var(--bg)}
li.enter{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.check{position:absolute;opacity:0;width:0;height:0}
label.wrap{display:flex;position:relative;flex:none;cursor:pointer}
.box{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--done);display:grid;place-items:center;
  transition:background .15s,border-color .15s
}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s ease}
.check:checked+.box{background:var(--accent);border-color:var(--accent)}
.check:checked+.box svg{stroke-dashoffset:0}
.text{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500;cursor:text;transition:color .2s}
li.done .text{color:var(--done);text-decoration:line-through;text-decoration-thickness:1.5px}
.edit{flex:1;min-width:0;font:inherit;font-weight:500;color:var(--ink);background:var(--bg);
  border:2px solid var(--accent);border-radius:8px;padding:4px 10px;outline:none}
.del{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);
  opacity:0;transition:opacity .15s,background .15s,color .15s
}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
@media (hover:none){.del{opacity:1}}
.del svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:.95rem}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:2px}
footer{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);
  font-size:.88rem;color:var(--muted);font-weight:500}
footer button{font-weight:600;color:var(--muted);padding:4px 8px;border-radius:8px}
footer button:hover:not(:disabled){color:var(--danger)}
footer button:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Today’s tasks</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="actions">
    <button class="theme" id="theme" type="button" aria-label="Switch to dark mode" title="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="ring" aria-label="Completion progress">
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
        <circle class="track" cx="28" cy="28" r="23"/>
        <circle class="bar" id="bar" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/>
      </svg>
      <span id="pct">0%</span>
    </div>
    </div>
  </header>

  <section class="panel">
    <form class="add" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Add a task" aria-label="New task" maxlength="200">
      <button type="submit">Add task</button>
    </form>
    <div class="tabs" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Completed</button>
    </div>
    <ul id="list"></ul>
    <footer>
      <span id="count"></span>
      <button id="clear" type="button">Clear completed</button>
    </footer>
  </section>
</main>

<script>
(() => {
  const KEY = 'todo-tasks-v1';
  let tasks = [], filter = 'all';
  const $ = id => document.getElementById(id);
  const list = $('list'), input = $('input');
  const NS = 'http://www.w3.org/2000/svg';

  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };

  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  function icon(paths, cls) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    if (cls) s.setAttribute('class', cls);
    s.setAttribute('aria-hidden', 'true');
    paths.forEach(d => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.appendChild(p); });
    return s;
  }

  function startEdit(t, li, textEl) {
    const ed = document.createElement('input');
    ed.className = 'edit'; ed.value = t.text; ed.maxLength = 200; ed.setAttribute('aria-label', 'Edit task');
    textEl.replaceWith(ed); ed.focus(); ed.select();
    let finished = false;
    const finish = commit => {
      if (finished) return; finished = true;
      const v = ed.value.trim();
      if (commit && v) t.text = v;
      save(); render();
    };
    ed.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
    ed.addEventListener('blur', () => finish(true));
  }

  function item(t, isNew) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    if (isNew) li.classList.add('enter');

    const wrap = document.createElement('label'); wrap.className = 'wrap';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'check'; cb.checked = t.done;
    cb.setAttribute('aria-label', 'Mark “' + t.text + '” complete');
    const box = document.createElement('span'); box.className = 'box';
    box.appendChild(icon(['M4 12l5 5L20 6']));
    wrap.append(cb, box);
    cb.addEventListener('change', () => { t.done = cb.checked; save(); render(); });

    const text = document.createElement('span'); text.className = 'text'; text.textContent = t.text;
    text.title = 'Double-click to edit';
    text.addEventListener('dblclick', () => startEdit(t, li, text));

    const del = document.createElement('button'); del.type = 'button'; del.className = 'del';
    del.setAttribute('aria-label', 'Delete “' + t.text + '”');
    del.appendChild(icon(['M3 6h18', 'M8 6V4h8v2', 'M6 6l1 14h10l1-14', 'M10 11v5', 'M14 11v5']));
    del.addEventListener('click', () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); });

    li.append(wrap, text, del);
    return li;
  }

  let lastAdded = null;
  function render() {
    const total = tasks.length, done = tasks.filter(t => t.done).length, left = total - done;
    const shown = tasks.filter(t => filter === 'all' || (filter === 'done') === t.done);

    list.replaceChildren();
    if (!shown.length) {
      const e = document.createElement('li'); e.className = 'empty';
      const msgs = {
        all: ['Nothing on your list', 'Type a task above and press Enter.'],
        active: ['All caught up', 'No open tasks right now.'],
        done: ['No completed tasks yet', 'Check one off to see it here.']
      }[filter];
      const s = document.createElement('strong'); s.textContent = msgs[0];
      e.append(s, msgs[1]); e.style.display = 'block'; e.style.cursor = 'default';
      list.appendChild(e);
    } else shown.forEach(t => list.appendChild(item(t, t.id === lastAdded)));
    lastAdded = null;

    const pct = total ? Math.round(done / total * 100) : 0;
    $('pct').textContent = pct + '%';
    $('bar').style.strokeDashoffset = 144.5 * (1 - pct / 100);
    $('count').textContent = left === 1 ? '1 task left' : left + ' tasks left';
    $('clear').disabled = !done;
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    const t = { id: Date.now() + Math.random(), text: v, done: false };
    tasks.unshift(t); lastAdded = t.id;
    input.value = '';
    if (filter === 'done') setFilter('all'); else render();
    save();
  });

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
    render();
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.f)));

  $('clear').addEventListener('click', () => { tasks = tasks.filter(t => !t.done); save(); render(); });

  const root = document.documentElement, themeBtn = $('theme');
  function syncTheme() {
    const dark = root.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  themeBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('todo-theme', next); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  render();
})();
</script>
</body>
</html>
